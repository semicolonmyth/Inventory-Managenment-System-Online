[pytest]
# Test discovery lives in app/. Run from the app/ directory.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: fast pure-logic unit tests
    integration: tests that exercise the SQLite database layer
    pdf: invoice / receipt PDF generation tests
    security: authentication / secret-handling tests
    slow: tests that may take longer (large data, multi-page PDFs)
